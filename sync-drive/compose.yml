services:
  sync-drive:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: sync-drive
    hostname: server-sync-drive
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /home/REDACTED_USER/syncthing/config:/config
      - /home/REDACTED_USER/file-manager/drive:/data/drive
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
