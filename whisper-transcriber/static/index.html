<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whisper Transcriber</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--card-hover:#222531;--border:#2a2d3a;--text:#e4e4e7;--text-dim:#71717a;--accent:#7c3aed;--accent-hover:#6d28d9;--accent-glow:rgba(124,58,237,.25);--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--radius:12px;--radius-sm:8px}
html{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:0}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:inherit}

.container{max-width:900px;margin:0 auto;padding:24px 20px 60px}

/* Header */
.header{text-align:center;padding:40px 0 32px}
.header h1{font-size:2rem;font-weight:700;letter-spacing:-.02em}
.header .subtitle{color:var(--text-dim);font-size:.875rem;margin-top:6px}
.gpu-badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 14px;background:var(--card);border:1px solid var(--border);border-radius:20px;font-size:.8rem;font-weight:500}
.gpu-badge .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.gpu-badge .dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.gpu-badge .dot.off{background:var(--red);box-shadow:0 0 6px var(--red)}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.card-title{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:16px}

/* Upload zone */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:48px 24px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--accent-glow)}
.upload-zone.has-file{border-style:solid;border-color:var(--accent)}
.upload-icon{font-size:2.5rem;margin-bottom:12px}
.upload-text{color:var(--text-dim);font-size:.9rem}
.upload-text strong{color:var(--text)}
.file-info{margin-top:12px;font-size:.85rem;color:var(--accent)}
.file-info .file-size{color:var(--text-dim);margin-left:8px}
input[type=file]{display:none}

/* Selected files */
.file-list{list-style:none;margin-top:12px;max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
.file-list li{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:.82rem;border-bottom:1px solid var(--border)}
.file-list li:last-child{border-bottom:none}
.file-list .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-list .size{color:var(--text-dim);font-size:.75rem;flex-shrink:0}
.file-list .remove{background:none;border:none;color:var(--text-dim);font-size:1rem;line-height:1;padding:2px 6px;border-radius:4px}
.file-list .remove:hover{color:var(--red);background:var(--bg)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-size:.875rem;font-weight:600;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--card-hover)}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-danger:hover{background:rgba(239,68,68,.1)}
.btn-sm{padding:6px 12px;font-size:.78rem;border-radius:6px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.transcribe-row{display:flex;align-items:center;gap:12px;margin-top:16px}

/* Options panel */
.options-toggle{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--text-dim);font-size:.85rem;font-weight:500;padding:0;margin-bottom:12px}
.options-toggle .arrow{transition:transform .2s;font-size:.7rem}
.options-toggle .arrow.open{transform:rotate(90deg)}
.options-grid{display:none;grid-template-columns:1fr 1fr;gap:16px}
.options-grid.open{display:grid}
.form-group label{display:block;font-size:.78rem;font-weight:500;color:var(--text-dim);margin-bottom:6px}
.form-group select,.form-group input[type=range]{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85rem;outline:none}
.form-group select:focus{border-color:var(--accent)}
.form-group input[type=range]{padding:0;margin-top:4px;accent-color:var(--accent)}
.range-value{font-size:.78rem;color:var(--accent);float:right}
.toggle-row{display:flex;align-items:center;justify-content:space-between}
.toggle{position:relative;width:40px;height:22px;background:var(--border);border-radius:11px;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(18px)}

/* Progress */
.progress-section{display:none}
.progress-section.active{display:block}
.progress-bar-track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:12px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#a78bfa);border-radius:3px;transition:width .3s;width:0%}
.progress-bar-fill.indeterminate{width:30%!important;animation:indeterminate 1.5s infinite ease-in-out}
@keyframes indeterminate{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
.progress-info{display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
.progress-status{color:var(--text)}
.progress-elapsed{color:var(--text-dim);font-size:.78rem}

/* Batch queue */
.queue-list{list-style:none;margin-top:16px;max-height:420px;overflow-y:auto}
.queue-item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--border);font-size:.82rem}
.queue-item .status-pill{min-width:78px;text-align:center}
.queue-item .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.queue-item.viewing .name{color:var(--accent)}
.queue-item .actions{display:flex;gap:4px}
.queue-item .mini-track{grid-column:2/4;height:3px;background:var(--bg);border-radius:2px;overflow:hidden}
.queue-item .mini-fill{height:100%;background:var(--accent);transition:width .3s}
.queue-item .detail{grid-column:2/4;color:var(--text-dim);font-size:.75rem;overflow-wrap:anywhere}
.zip-group{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.zip-label{font-size:.78rem;color:var(--text-dim)}

/* Results */
.result-section{display:none}
.result-section.active{display:block}
.result-meta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.meta-badge{padding:5px 12px;background:var(--bg);border-radius:6px;font-size:.78rem;display:flex;align-items:center;gap:6px}
.meta-badge .label{color:var(--text-dim)}
.transcript-viewer{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;max-height:400px;overflow-y:auto;font-size:.85rem;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.seg-time{color:var(--accent);font-size:.75rem;font-weight:600;margin-right:8px;user-select:none}
.word-highlight{background:var(--accent-glow);border-radius:3px;padding:1px 2px}

/* History */
#historyContent{overflow-x:auto}
.history-table{width:100%;border-collapse:collapse;font-size:.82rem}
.history-table th{text-align:left;padding:10px 12px;color:var(--text-dim);font-weight:600;border-bottom:1px solid var(--border);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.history-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.history-table tr:hover td{background:var(--card-hover)}
.status-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:600}
.status-pill.completed{background:rgba(34,197,94,.15);color:var(--green)}
.status-pill.processing{background:rgba(124,58,237,.15);color:#a78bfa}
.status-pill.error{background:rgba(239,68,68,.15);color:var(--red)}
.status-pill.uploading{background:rgba(124,58,237,.15);color:#a78bfa}
.status-pill.pending,.status-pill.waiting{background:rgba(113,113,122,.15);color:var(--text-dim)}
.status-pill.cancelled{background:rgba(245,158,11,.15);color:var(--orange)}
.history-actions{display:flex;gap:4px}
.history-actions button{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:4px;font-size:.85rem;border-radius:4px}
.history-actions button:hover{color:var(--text);background:var(--bg)}
.pagination{display:flex;justify-content:center;gap:8px;margin-top:16px}
.empty-state{text-align:center;padding:32px;color:var(--text-dim);font-size:.85rem}

/* Responsive */
@media(max-width:600px){
  .container{padding:16px 12px 40px}
  .header h1{font-size:1.5rem}
  .options-grid{grid-template-columns:1fr}
  .result-meta{gap:8px}
  .history-table{font-size:.75rem}
  .history-table th:nth-child(3),.history-table td:nth-child(3),
  .history-table th:nth-child(5),.history-table td:nth-child(5){display:none}
}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3d4a}
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>&#127897;&#65039; Whisper Transcriber</h1>
    <div class="subtitle">faster-whisper &middot; large-v3 &middot; RTX 3090 Ti</div>
    <div class="gpu-badge" id="gpuBadge">
      <span class="dot" id="gpuDot"></span>
      <span id="gpuText">Checking GPU...</span>
    </div>
  </div>

  <!-- Upload -->
  <div class="card">
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">&#128194;</div>
      <div class="upload-text"><strong>Drop audio or video files here</strong><br>or click to browse &middot; pick as many as you like</div>
      <div class="file-info" id="fileInfo" style="display:none">
        <span id="fileName"></span><span class="file-size" id="fileSize"></span>
      </div>
      <input type="file" id="fileInput" multiple accept=".mp3,.mp4,.wav,.m4a,.ogg,.flac,.mov,.mkv,.webm">
    </div>
    <ul class="file-list" id="fileList" style="display:none"></ul>

    <!-- Options -->
    <div style="margin-top:16px">
      <button class="options-toggle" id="optionsToggle">
        <span class="arrow" id="optionsArrow">&#9654;</span> Advanced Options
      </button>
      <div class="options-grid" id="optionsGrid">
        <div class="form-group">
          <label>Model Size</label>
          <select id="optModel">
            <option value="tiny">Tiny (fastest)</option>
            <option value="base">Base</option>
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large-v3" selected>Large-v3 (best)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Language</label>
          <select id="optLanguage">
            <option value="auto">Auto-detect</option>
            <option value="af">Afrikaans</option><option value="ar">Arabic</option><option value="hy">Armenian</option>
            <option value="az">Azerbaijani</option><option value="be">Belarusian</option><option value="bs">Bosnian</option>
            <option value="bg">Bulgarian</option><option value="ca">Catalan</option><option value="zh">Chinese</option>
            <option value="hr">Croatian</option><option value="cs">Czech</option><option value="da">Danish</option>
            <option value="nl">Dutch</option><option value="en">English</option><option value="et">Estonian</option>
            <option value="fi">Finnish</option><option value="fr">French</option><option value="gl">Galician</option>
            <option value="de">German</option><option value="el">Greek</option><option value="he">Hebrew</option>
            <option value="hi">Hindi</option><option value="hu">Hungarian</option><option value="is">Icelandic</option>
            <option value="id">Indonesian</option><option value="it">Italian</option><option value="ja">Japanese</option>
            <option value="kn">Kannada</option><option value="kk">Kazakh</option><option value="ko">Korean</option>
            <option value="lv">Latvian</option><option value="lt">Lithuanian</option><option value="mk">Macedonian</option>
            <option value="ms">Malay</option><option value="mr">Marathi</option><option value="mi">Maori</option>
            <option value="ne">Nepali</option><option value="no">Norwegian</option><option value="fa">Persian</option>
            <option value="pl">Polish</option><option value="pt">Portuguese</option><option value="ro">Romanian</option>
            <option value="ru">Russian</option><option value="sr">Serbian</option><option value="sk">Slovak</option>
            <option value="sl">Slovenian</option><option value="es">Spanish</option><option value="sw">Swahili</option>
            <option value="sv">Swedish</option><option value="tl">Tagalog</option><option value="ta">Tamil</option>
            <option value="th">Thai</option><option value="tr">Turkish</option><option value="uk">Ukrainian</option>
            <option value="ur">Urdu</option><option value="vi">Vietnamese</option><option value="cy">Welsh</option>
          </select>
        </div>
        <div class="form-group">
          <label>Compute Type</label>
          <select id="optCompute">
            <option value="float16">float16 (faster)</option>
            <option value="int8">int8 (less VRAM)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Output Format</label>
          <select id="optFormat">
            <option value="srt">SRT</option>
            <option value="vtt">VTT</option>
            <option value="txt">Plain Text</option>
            <option value="json">JSON</option>
          </select>
        </div>
        <div class="form-group">
          <label class="toggle-row">Word Timestamps <span class="toggle on" id="toggleWordTs" data-val="true"></span></label>
        </div>
        <div class="form-group">
          <label>Beam Size <span class="range-value" id="beamVal">5</span></label>
          <input type="range" id="optBeam" min="1" max="10" value="5">
        </div>
      </div>
    </div>

    <div class="transcribe-row">
      <button class="btn btn-primary" id="btnTranscribe" disabled>Transcribe</button>
      <button class="btn btn-secondary" id="btnClear" style="display:none">Clear</button>
    </div>
  </div>

  <!-- Progress / batch queue -->
  <div class="card progress-section" id="progressSection">
    <div class="card-title" id="queueTitle">Progress</div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="progress-info">
      <span class="progress-status" id="progressStatus">Starting...</span>
      <span class="progress-elapsed" id="progressElapsed">0:00</span>
    </div>
    <ul class="queue-list" id="queueList"></ul>
    <div class="btn-group">
      <button class="btn btn-danger btn-sm" id="btnCancel">Cancel</button>
      <span class="zip-group" id="zipGroup" style="display:none">
        <span class="zip-label">Download all (.zip)</span>
        <button class="btn btn-secondary btn-sm" onclick="downloadBatch('srt')">&#128230; SRT</button>
        <button class="btn btn-secondary btn-sm" onclick="downloadBatch('vtt')">&#128230; VTT</button>
        <button class="btn btn-secondary btn-sm" onclick="downloadBatch('txt')">&#128230; TXT</button>
        <button class="btn btn-secondary btn-sm" onclick="downloadBatch('json')">&#128230; JSON</button>
      </span>
    </div>
  </div>

  <!-- Results -->
  <div class="card result-section" id="resultSection">
    <div class="card-title">Result</div>
    <div class="result-meta" id="resultMeta"></div>
    <div class="transcript-viewer" id="transcriptViewer"></div>
    <div class="btn-group">
      <button class="btn btn-secondary btn-sm" onclick="downloadResult('srt')">&#128196; SRT</button>
      <button class="btn btn-secondary btn-sm" onclick="downloadResult('vtt')">&#128196; VTT</button>
      <button class="btn btn-secondary btn-sm" onclick="downloadResult('txt')">&#128196; TXT</button>
      <button class="btn btn-secondary btn-sm" onclick="downloadResult('json')">&#128196; JSON</button>
      <button class="btn btn-secondary btn-sm" id="btnCopy">&#128203; Copy</button>
      <button class="btn btn-primary btn-sm" id="btnNew">&#10010; New Transcription</button>
    </div>
  </div>

  <!-- History -->
  <div class="card">
    <div class="card-title">History</div>
    <div id="historyContent"><div class="empty-state">No transcriptions yet</div></div>
    <div class="pagination" id="pagination"></div>
  </div>

</div>

<script>
const API = window.location.origin;
const ALLOWED = ['mp3','mp4','wav','m4a','ogg','flac','mov','mkv','webm'];
const TERMINAL = ['completed', 'error', 'cancelled'];
let currentJobId = null;   // job shown in the Result card
let pollTimer = null;
let elapsedTimer = null;
let selectedFiles = [];
let batch = null;          // batch shown in the progress card: {id, items, local, uploading, cancelled, ...}
let historyPage = 1;

// Elements
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');
const fileName = document.getElementById('fileName');
const fileSize = document.getElementById('fileSize');
const fileList = document.getElementById('fileList');
const btnTranscribe = document.getElementById('btnTranscribe');
const btnClear = document.getElementById('btnClear');
const queueTitle = document.getElementById('queueTitle');
const queueList = document.getElementById('queueList');
const zipGroup = document.getElementById('zipGroup');
const progressSection = document.getElementById('progressSection');
const progressBar = document.getElementById('progressBar');
const progressStatus = document.getElementById('progressStatus');
const progressElapsed = document.getElementById('progressElapsed');
const resultSection = document.getElementById('resultSection');
const resultMeta = document.getElementById('resultMeta');
const transcriptViewer = document.getElementById('transcriptViewer');
const btnCancel = document.getElementById('btnCancel');
const btnCopy = document.getElementById('btnCopy');
const btnNew = document.getElementById('btnNew');
const gpuDot = document.getElementById('gpuDot');
const gpuText = document.getElementById('gpuText');

// GPU check
fetch(API + '/health').then(r => r.json()).then(d => {
  if (d.gpu) {
    gpuDot.className = 'dot on';
    gpuText.textContent = 'GPU Ready';
  } else {
    gpuDot.className = 'dot off';
    gpuText.textContent = 'CPU Mode';
  }
}).catch(() => {
  gpuDot.className = 'dot off';
  gpuText.textContent = 'Offline';
});

// Upload zone events
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFiles(fileInput.files); });
btnClear.addEventListener('click', () => { selectedFiles = []; renderSelection(); });

function handleFiles(list) {
  const skipped = [];
  for (const f of list) {
    const ext = f.name.split('.').pop().toLowerCase();
    if (!ALLOWED.includes(ext)) { skipped.push(f.name); continue; }
    if (!selectedFiles.some(s => s.name === f.name && s.size === f.size)) selectedFiles.push(f);
  }
  if (skipped.length) alert('Skipped unsupported files:\n' + skipped.join('\n'));
  renderSelection();
}

function removeFile(i) {
  selectedFiles.splice(i, 1);
  renderSelection();
}

function renderSelection() {
  const n = selectedFiles.length;
  fileInput.value = '';   // so picking the same file again still fires 'change'
  uploadZone.classList.toggle('has-file', n > 0);
  fileInfo.style.display = n ? '' : 'none';
  fileName.textContent = n === 1 ? selectedFiles[0].name : n + ' files';
  fileSize.textContent = formatSize(selectedFiles.reduce((t, f) => t + f.size, 0));
  fileList.style.display = n > 1 ? '' : 'none';
  fileList.innerHTML = selectedFiles.map((f, i) =>
    `<li><span class="name" title="${escHtml(f.name)}">${escHtml(f.name)}</span>` +
    `<span class="size">${formatSize(f.size)}</span>` +
    `<button class="remove" title="Remove" onclick="removeFile(${i})">&times;</button></li>`).join('');
  btnTranscribe.disabled = n === 0;
  const verb = batchActive() ? 'Add to queue' : 'Transcribe';
  btnTranscribe.textContent = n > 1 ? `${verb} (${n} files)` : verb;
  btnClear.style.display = n ? '' : 'none';
}

function formatSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
  return (b/1073741824).toFixed(2) + ' GB';
}

// Options toggle
document.getElementById('optionsToggle').addEventListener('click', () => {
  const grid = document.getElementById('optionsGrid');
  const arrow = document.getElementById('optionsArrow');
  grid.classList.toggle('open');
  arrow.classList.toggle('open');
});

// Toggle switches
document.getElementById('toggleWordTs').addEventListener('click', function() {
  const on = this.dataset.val === 'true';
  this.dataset.val = on ? 'false' : 'true';
  this.classList.toggle('on');
});

// Beam size
document.getElementById('optBeam').addEventListener('input', function() {
  document.getElementById('beamVal').textContent = this.value;
});

// Transcribe
btnTranscribe.addEventListener('click', startTranscription);

// Every run is a batch (a single file is a batch of one). While a batch is still running,
// Transcribe adds the newly picked files to it.
function startTranscription() {
  if (!selectedFiles.length) return;
  if (!batchActive()) {
    showBatch({ id: null, items: [], local: true, ahead: 0, settled: 0, startedAt: Date.now() });
    currentJobId = null;
    resultSection.classList.remove('active');
  }
  selectedFiles.forEach(f => batch.items.push({ name: f.name, size: f.size, file: f, upload: null }));
  selectedFiles = [];
  renderSelection();
  renderQueue();
  if (!batch.uploading) uploadQueued(batch);
}

function showBatch(b) {
  clearInterval(pollTimer);
  batch = b;
  queueList.innerHTML = '';
  progressBar.classList.remove('indeterminate');
  progressSection.classList.add('active');
  startElapsed(b.startedAt);
  renderQueue();
}

function batchDone(b) {
  return !b.uploading && b.items.length > 0 && b.items.every(i => TERMINAL.includes(itemState(i)));
}

function batchActive() {
  return !!batch && !batch.cancelled && !batchDone(batch);
}

// One file per request so each shows its own upload progress; the server starts on the
// first file while the rest are still uploading.
async function uploadQueued(b) {
  b.uploading = true;
  let it;
  while (!b.cancelled && (it = b.items.find(i => i.file && i.upload == null && !i.skipped))) {
    try {
      const d = await uploadFile(b, it);
      it.jobId = d.job_id;
      it.job = { id: d.job_id, status: 'pending', progress: 0 };   // until the next poll fills it in
      if (!b.id) {
        b.id = d.batch_id;
        if (b === batch) { rememberBatch(b.id); startPolling(); }
      }
    } catch (e) {
      if (e.aborted) it.skipped = true;
      else it.uploadError = e.message;
    }
    it.file = null;
    if (b === batch) renderQueue();
  }
  b.items.forEach(i => { if (i.file) { i.skipped = true; i.file = null; } });  // left behind by Cancel
  b.uploading = false;
  if (b !== batch) return;
  renderQueue();
  if (b.id) pollBatch(); else settle(b);
}

function uploadFile(b, it) {
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append('file', it.file);
    if (b.id) fd.append('batch_id', b.id);
    fd.append('model_size', document.getElementById('optModel').value);
    fd.append('language', document.getElementById('optLanguage').value);
    fd.append('compute_type', document.getElementById('optCompute').value);
    fd.append('word_timestamps', document.getElementById('toggleWordTs').dataset.val);
    fd.append('output_format', document.getElementById('optFormat').value);
    fd.append('beam_size', document.getElementById('optBeam').value);

    const xhr = new XMLHttpRequest();
    b.xhr = xhr;
    it.upload = 0;
    if (b === batch) renderQueue();
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const pct = Math.round(e.loaded / e.total * 100);
      if (pct !== it.upload) { it.upload = pct; if (b === batch) renderQueue(); }
    };
    xhr.onload = () => {
      let d = {};
      try { d = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status === 202 && d.job_id) resolve(d);
      else reject(new Error(d.error || 'Upload failed (HTTP ' + xhr.status + ')'));
    };
    xhr.onerror = () => reject(new Error('Upload failed (network error)'));
    xhr.onabort = () => reject(Object.assign(new Error('Cancelled'), { aborted: true }));
    xhr.open('POST', API + '/transcribe');
    xhr.send(fd);
  });
}

function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(pollBatch, 1500);
  pollBatch();
}

function pollBatch() {
  const b = batch;
  if (!b || !b.id) return;
  fetch(API + '/batch/' + b.id)
    .then(r => r.json())
    .then(d => {
      if (b !== batch || !d.jobs) return;
      b.ahead = d.queued_ahead || 0;
      d.jobs.forEach(j => {
        let it = b.items.find(i => i.jobId === j.id);
        if (!it) {
          if (b.local) return;  // a file whose upload response hasn't come back yet
          it = { name: j.original_filename, jobId: j.id };
          b.items.push(it);
        }
        it.job = j;
      });
      renderQueue();
      settle(b);
    })
    .catch(() => {});
}

// Refresh history as files finish, and wrap up once every file has.
function settle(b) {
  const settled = b.items.filter(i => TERMINAL.includes(itemState(i))).length;
  if (settled !== b.settled) { b.settled = settled; loadHistory(historyPage); }
  if (!batchDone(b)) return;
  clearInterval(pollTimer);
  clearInterval(elapsedTimer);
  if (!b.local) {
    const ends = b.items.map(i => i.job && parseUtc(i.job.completed_at)).filter(Boolean);
    if (ends.length) showElapsed(Math.max(...ends) - b.startedAt);
  }
  if (recallBatch() === b.id) forgetBatch();
  renderSelection();
  const only = b.items.length === 1 && b.items[0];
  if (b.local && only.job && only.job.status === 'completed') viewJob(only.jobId);
}

function itemState(it) {
  if (it.job) return it.job.status;
  if (it.skipped) return 'cancelled';
  if (it.uploadError) return 'error';
  if (it.upload != null) return 'uploading';
  return 'waiting';
}

function itemError(it) {
  return (it.job && it.job.error) || it.uploadError || 'Unknown error';
}

function renderQueue() {
  const b = batch;
  if (!b) return;
  const n = b.items.length;
  const states = b.items.map(itemState);
  b.items.forEach(renderItem);
  queueList.style.display = n > 1 ? '' : 'none';

  const count = s => states.filter(x => x === s).length;
  const done = count('completed'), failed = count('error'), cancelled = count('cancelled');
  queueTitle.textContent = n > 1 ? `Batch · ${done} of ${n} transcribed` : 'Progress';

  const pct = n ? b.items.reduce((t, it, i) =>
    t + (TERMINAL.includes(states[i]) ? 100 : it.job ? it.job.progress || 0 : 0), 0) / n : 0;
  progressBar.style.width = pct + '%';

  const pi = states.indexOf('processing'), ui = states.indexOf('uploading');
  let text;
  if (batchDone(b)) {
    text = n === 1
      ? { completed: 'Complete!', cancelled: 'Cancelled', error: 'Error: ' + itemError(b.items[0]) }[states[0]]
      : [`${done} transcribed`, failed && `${failed} failed`, cancelled && `${cancelled} cancelled`].filter(Boolean).join(' · ');
  } else if (pi >= 0) {
    const st = b.items[pi].job.status_text || 'Processing...';
    text = n === 1 ? st : `File ${pi + 1} of ${n} · ${st}`;
  } else if (ui >= 0) {
    text = (n === 1 ? 'Uploading' : `Uploading ${b.items[ui].name}`) + ` — ${b.items[ui].upload}%`;
  } else if (states.includes('pending')) {
    text = b.ahead ? `Queued behind ${b.ahead} other file${b.ahead === 1 ? '' : 's'}` : 'Queued...';
  } else {
    text = b.cancelled ? 'Cancelling...' : 'Starting...';
  }
  progressStatus.textContent = text;
  btnCancel.style.display = batchDone(b) ? 'none' : '';
  zipGroup.style.display = n > 1 && done > 0 ? '' : 'none';
}

const PILL_LABEL = { pending: 'queued', waiting: 'waiting' };

function renderItem(it, i) {
  if (!it.el) {
    it.el = document.createElement('li');
    it.el.className = 'queue-item';
    it.el.innerHTML = '<span class="status-pill"></span><span class="name"></span><span class="actions"></span>' +
      '<div class="mini-track"><div class="mini-fill"></div></div><span class="detail"></span>';
    queueList.appendChild(it.el);
  }
  const q = sel => it.el.querySelector(sel);
  const st = itemState(it), j = it.job;
  q('.status-pill').className = 'status-pill ' + st;
  q('.status-pill').textContent = PILL_LABEL[st] || st;
  q('.name').textContent = it.name;
  q('.name').title = it.name;

  let detail, bar = null;
  if (st === 'waiting') detail = formatSize(it.size) + ' · waiting to upload';
  else if (st === 'uploading') { detail = `Uploading ${it.upload}%`; bar = it.upload; }
  else if (st === 'pending') detail = 'Queued';
  else if (st === 'processing') { detail = j.status_text || 'Processing...'; bar = j.progress || 0; }
  else if (st === 'completed') {
    const speed = j.duration && j.transcription_time ? (j.duration / j.transcription_time).toFixed(1) + 'x realtime' : '';
    detail = [formatDuration(j.duration), j.detected_language, speed].filter(Boolean).join(' · ');
  }
  else if (st === 'error') detail = itemError(it);
  else detail = 'Cancelled';
  q('.detail').textContent = detail;
  q('.mini-track').style.display = bar == null ? 'none' : '';
  if (bar != null) q('.mini-fill').style.width = bar + '%';
  it.el.classList.toggle('viewing', !!it.jobId && it.jobId === currentJobId);

  // Rebuild buttons only when the state changes, so a click isn't swallowed by a re-render
  if (it.renderedState !== st) {
    it.renderedState = st;
    q('.actions').innerHTML = st === 'completed'
      ? `<button class="btn btn-secondary btn-sm" onclick="viewJob('${it.jobId}')">View</button>`
      : TERMINAL.includes(st) ? ''
      : `<button class="btn btn-danger btn-sm" title="Cancel this file" onclick="cancelItem(${i})">&times;</button>`;
  }
}

function cancelItem(i) {
  const it = batch && batch.items[i];
  if (!it) return;
  if (it.jobId) fetch(API + '/cancel/' + it.jobId, { method: 'POST' }).then(pollBatch);
  else if (it.upload != null) batch.xhr && batch.xhr.abort();   // the file uploading right now
  else { it.skipped = true; it.file = null; }
  renderQueue();
}

// Opens a batch from History, or the one this tab was running before a reload
function openBatch(id, onlyIfRunning) {
  if (batch && batch.id === id) { progressSection.scrollIntoView({ behavior: 'smooth' }); return; }
  fetch(API + '/batch/' + id)
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !d.jobs) { if (onlyIfRunning) forgetBatch(); return; }
      const items = d.jobs.map(j => ({ name: j.original_filename, jobId: j.id, job: j }));
      const b = { id, items, local: false, ahead: d.queued_ahead || 0, settled: -1, startedAt: parseUtc(d.jobs[0].created_at) };
      if (onlyIfRunning && batchDone(b)) { forgetBatch(); return; }
      if (batchActive() && batch.local && batch.uploading && batch.id !== id &&
          !confirm('Files are still uploading in the current batch. Leave it uploading in the background and open this one?')) return;
      showBatch(b);
      settle(b);
      if (!batchDone(b)) { rememberBatch(id); startPolling(); }
      renderSelection();
      if (!onlyIfRunning) progressSection.scrollIntoView({ behavior: 'smooth' });
    });
}

function downloadBatch(fmt) {
  if (!batch || !batch.id) return;
  window.open(API + '/batch/' + batch.id + '/download/' + fmt, '_blank');
}

function startElapsed(t0) {
  clearInterval(elapsedTimer);
  const tick = () => showElapsed(Date.now() - t0);
  tick();
  elapsedTimer = setInterval(tick, 1000);
}

function showElapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  progressElapsed.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

// The server stores UTC without a zone ('2026-10-22 17:03:00' or '2026-10-22T17:03:00.123456')
function parseUtc(s) {
  return s ? Date.parse(s.replace(' ', 'T') + 'Z') : null;
}

// Remember the running batch so a reload picks it back up
function rememberBatch(id) { try { localStorage.setItem('whisperBatch', id); } catch (e) {} }
function forgetBatch() { try { localStorage.removeItem('whisperBatch'); } catch (e) {} }
function recallBatch() { try { return localStorage.getItem('whisperBatch'); } catch (e) { return null; } }

function loadResult(jobId) {
  fetch(API + '/result/' + jobId)
    .then(r => r.json())
    .then(d => {
      if (d.error) return;
      // Meta badges
      const speed = d.duration && d.transcription_time ? (d.duration / d.transcription_time).toFixed(1) : '?';
      const langConf = d.language_confidence ? (d.language_confidence * 100).toFixed(0) : '?';
      resultMeta.innerHTML = `
        <div class="meta-badge"><span class="label">Language</span> ${d.detected_language || '?'} (${langConf}%)</div>
        <div class="meta-badge"><span class="label">Duration</span> ${formatDuration(d.duration)}</div>
        <div class="meta-badge"><span class="label">Speed</span> ${speed}x realtime</div>
        <div class="meta-badge"><span class="label">Model</span> ${d.model_size}</div>
      `;
      // Transcript
      let html = '';
      if (d.segments && d.segments.length) {
        d.segments.forEach(seg => {
          const ts = formatDuration(seg.start);
          if (d.word_timestamps && seg.words && seg.words.length) {
            html += `<div><span class="seg-time">[${ts}]</span>`;
            seg.words.forEach(w => {
              const cls = w.probability < 0.5 ? ' class="word-highlight"' : '';
              html += `<span${cls}>${escHtml(w.word)}</span>`;
            });
            html += '</div>';
          } else {
            html += `<div><span class="seg-time">[${ts}]</span>${escHtml(seg.text)}</div>`;
          }
        });
      } else {
        html = escHtml(d.text || 'No transcription text');
      }
      transcriptViewer.innerHTML = html;
      resultSection.classList.add('active');
    });
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML.replace(/"/g, '&quot;');   // also safe inside title="..."
}

function formatDuration(s) {
  if (!s && s !== 0) return '?';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function downloadResult(fmt) {
  if (!currentJobId) return;
  window.open(API + '/download/' + currentJobId + '/' + fmt, '_blank');
}

// Cancel the whole batch: stop uploading, drop queued files, stop the one transcribing
btnCancel.addEventListener('click', () => {
  if (!batch) return;
  batch.cancelled = true;
  if (batch.xhr) batch.xhr.abort();
  if (batch.id) fetch(API + '/batch/' + batch.id + '/cancel', { method: 'POST' }).then(pollBatch);
  renderQueue();
});

// Copy
btnCopy.addEventListener('click', () => {
  const text = transcriptViewer.innerText;
  navigator.clipboard.writeText(text).then(() => {
    btnCopy.textContent = '\u2713 Copied!';
    setTimeout(() => { btnCopy.innerHTML = '&#128203; Copy'; }, 2000);
  });
});

// New transcription
btnNew.addEventListener('click', () => {
  currentJobId = null;
  selectedFiles = [];
  resultSection.classList.remove('active');
  if (!batchActive()) {   // a running batch stays on screen
    batch = null;
    progressSection.classList.remove('active');
  }
  renderSelection();
  renderQueue();
});

// History
function loadHistory(page) {
  page = page || 1;
  historyPage = page;
  fetch(API + '/history?page=' + page + '&per_page=10')
    .then(r => r.json())
    .then(d => {
      const el = document.getElementById('historyContent');
      const pg = document.getElementById('pagination');
      if (!d.jobs || !d.jobs.length) {
        el.innerHTML = '<div class="empty-state">No transcriptions yet</div>';
        pg.innerHTML = '';
        return;
      }
      let html = '<table class="history-table"><thead><tr><th>File</th><th>Duration</th><th>Model</th><th>Language</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>';
      d.jobs.forEach(j => {
        const name = j.original_filename || '?';
        const short = name.length > 30 ? name.slice(0,27) + '...' : name;
        const dur = j.duration ? formatDuration(j.duration) : '-';
        const lang = j.detected_language || '-';
        const date = j.created_at ? j.created_at.slice(0,16).replace('T',' ') : '-';
        html += `<tr>
          <td title="${escHtml(name)}">${escHtml(short)}</td>
          <td>${dur}</td>
          <td>${j.model_size || '-'}</td>
          <td>${lang}</td>
          <td>${date}</td>
          <td><span class="status-pill ${j.status}">${j.status}</span></td>
          <td><div class="history-actions">`;
        if (j.status === 'completed') {
          html += `<button title="View" onclick="viewJob('${j.id}')">&#128065;</button>`;
          html += `<button title="Download SRT" onclick="window.open('${API}/download/${j.id}/srt')">&#11015;</button>`;
        }
        if (j.batch_size > 1) {
          html += `<button title="Open its batch (${j.batch_size} files)" onclick="openBatch('${j.batch_id}')">&#128230;</button>`;
        }
        html += `<button title="Delete" onclick="deleteJob('${j.id}')">&#128465;</button>`;
        html += '</div></td></tr>';
      });
      html += '</tbody></table>';
      el.innerHTML = html;

      // Pagination
      const totalPages = Math.ceil(d.total / d.per_page);
      let pgHtml = '';
      for (let i = 1; i <= totalPages; i++) {
        pgHtml += `<button class="btn btn-sm ${i===page?'btn-primary':'btn-secondary'}" onclick="loadHistory(${i})">${i}</button>`;
      }
      pg.innerHTML = pgHtml;
    });
}

function viewJob(id) {
  currentJobId = id;
  loadResult(id);
  renderQueue();
  resultSection.scrollIntoView({ behavior: 'smooth' });
}

function deleteJob(id) {
  if (!confirm('Delete this job?')) return;
  fetch(API + '/delete/' + id, { method: 'DELETE' })
    .then(() => loadHistory(historyPage));
}

// Init
loadHistory();
const savedBatch = recallBatch();
if (savedBatch) openBatch(savedBatch, true);
</script>
</body>
</html>
